<!DOCTYPE html><html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KaiSaitHAHAHA</title>
<style>
:root{--bg:#0f1220;--bg2:#1b2040;--fg:#f2f4ff;--mut:#9aa3c7;--ac:#7c5cff;--ac2:#27d3c3;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);box-sizing:border-box}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef1fb;--bg2:#dfe4fa;--fg:#161a33;--mut:#5a6290;--card:rgba(255,255,255,.8);--bd:rgba(0,0,0,.12)}}
:root[data-theme="light"]{--bg:#eef1fb;--bg2:#dfe4fa;--fg:#161a33;--mut:#5a6290;--card:rgba(255,255,255,.8);--bd:rgba(0,0,0,.12)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(900px 500px at 15% -10%,var(--bg2),transparent),var(--bg);background-attachment:fixed;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:none}#app.on{display:block}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
header b{font-size:16px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{padding:11px 20px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--ac),#9b6bff);color:#fff;font-weight:600}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.btn:disabled{opacity:.6;cursor:default}
.feed{max-width:520px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
.post{background:var(--card);border:1px solid var(--bd);border-radius:22px;overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:14px}
.stage{perspective:1000px;display:grid;place-items:center;padding:26px 0 34px}
.card{position:relative;width:min(58vw,250px);aspect-ratio:3/4;transform-style:preserve-3d;animation:spin 9s linear infinite;filter:drop-shadow(0 18px 22px rgba(0,0,0,.4))}
.post:hover .card,.post:active .card{animation-play-state:paused}
@keyframes spin{from{transform:rotateY(0) rotateX(-4deg)}to{transform:rotateY(360deg) rotateX(-4deg)}}
.f{position:absolute;inset:0;border-radius:16px;background-size:cover;background-position:center;backface-visibility:hidden}
.e{filter:brightness(.5);backface-visibility:visible}.bk{transform:translateZ(-14px) rotateY(180deg)}
.tx{padding:0 16px 16px;font-size:17px;line-height:1.4}
@media (prefers-reduced-motion: reduce){.card{animation:none}}
.end{text-align:center;color:var(--mut);font-size:13px}
/* modals */
#ov{position:fixed;inset:0;z-index:50;background:rgba(8,10,25,.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px}
#ov.on{display:flex}
.box{width:min(100%,400px);max-height:88vh;overflow:auto;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:24px;padding:26px 22px;text-align:center;animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.box h2{margin:0 0 16px;font-size:22px;line-height:1.3}
.box input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:17px;text-align:center;outline:none;margin-bottom:14px}
.box input:focus{border-color:var(--ac)}
.row{display:flex;gap:10px;justify-content:center}.row .btn{flex:1}
.err{color:#ff6b6b;font-size:14px;min-height:20px;margin:-4px 0 8px}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.big{font-size:clamp(54px,18vw,92px);font-weight:900;letter-spacing:.04em;margin:6px 0 20px;background:linear-gradient(90deg,#ff5f6d,#ffc371);-webkit-background-clip:text;background-clip:text;color:transparent}
.nice{font-size:34px;font-weight:800;margin:6px 0 20px}
.li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}
.li span:last-child{color:var(--mut);font-size:12px;white-space:nowrap;align-self:center}
.cnt{color:var(--mut);font-size:13px;margin:-8px 0 8px}
</style></head><body>
<div id="app">
<header><b id="hi">3D Лента</b><button class="btn ghost" id="adm">Админ панель</button></header>
<main class="feed" id="feed"></main>
</div>

 function dodge(){if(busy)return;var w=yes.offsetWidth,h=yes.offsetHeight;
  if(!ph){ph=el('div');ph.style.cssText='flex:1;height:'+h+'px';r.insertBefore(ph,yes);yes.style.cssText='position:fixed;z-index:60;width:'+w+'px;transition:left .09s,top .09s;margin:0'}
  var ox=parseFloat(yes.style.left)||-999,oy=parseFloat(yes.style.top)||-999,x,y,t=0;
  do{x=8+Math.random()*Math.max(1,innerWidth-w-16);y=8+Math.random()*Math.max(1,innerHeight-h-16);t++}
  while(t<12&&Math.abs(x-ox)<w&&Math.abs(y-oy)<h*2);
  yes.style.left=x+'px';yes.style.top=y+'px'}
 function touch(e){if(busy||tries>=8||e.pointerType==='touch')return;tries++;e.preventDefault();dodge()}
 yes.addEventListener('pointerdown',touch);
 yes.addEventListener('touchstart',function(e){if(busy||tries>=8)return;tries++;e.preventDefault();dodge()},{passive:false});
 yes.addEventListener('pointerenter',function(e){if(e.pointerType==='mouse')dodge()})})}
/* step 3: result */
function stepResult(isYes){modal(function(b){
 b.appendChild(el('div',isYes?'big':'nice',isYes?'СГЛЕ':'ой молодец'));
 var c=el('button','btn','Жабу');c.style.width='100%';c.onclick=enterSite;b.appendChild(c)})}
/* site */
function enterSite(){closeModal();$('hi').textContent='Сәлем, '+userName+'!';$('app').className='on';window.scrollTo(0,0)}
function buildFeed(){var f=$('feed');IMG.forEach(function(s,i){
 var p=el('article','post'),h=el('div','ph'),av=el('div','av',String(i+1));h.append(av,el('span','','Модель '+(i+1)));
 var st=el('div','stage'),c=el('div','card'),u='url('+s+')',n=el('div','f');n.style.backgroundImage=u;c.appendChild(n);
 for(var k=1;k<8;k++){var e=el('div','f e');e.style.backgroundImage=u;e.style.transform='translateZ('+(-k*2)+'px)';c.appendChild(e)}
 var bk=el('div','f bk');bk.style.backgroundImage=u;c.appendChild(bk);st.appendChild(c);
 p.append(h,st,el('div','tx',CAP[i]));f.appendChild(p)});
 f.appendChild(el('div','end','— соңы —'))}
/* admin */
function askPin(){modal(function(b){
 b.appendChild(el('h2','','Админ панель'));
 var inp=el('input');inp.type='password';inp.inputMode='numeric';inp.maxLength=12;inp.placeholder='PIN';inp.autocomplete='off';
 var er=el('div','err'),r=el('div','row'),cl=el('button','btn ghost','Жабу'),ok=el('button','btn','Кіру');
 function go(){if(inp.value===PIN)showList();else{er.textContent='Қате PIN';inp.value='';shake(b)}}
 ok.onclick=go;cl.onclick=closeModal;inp.onkeydown=function(e){if(e.key==='Enter')go()};
 r.append(cl,ok);b.append(inp,er,r)})}
function showList(){var list=remote||localList().slice().reverse();
 modal(function(b){b.appendChild(el('h2','','Кім кірді'));
  var seen=remote?'':'';b.appendChild(el('div','cnt','Барлығы: '+list.length));
  if(!list.length)b.appendChild(el('div','cnt','Әзірге ешкім жоқ'));
  list.forEach(function(e){var li=el('div','li');li.appendChild(el('span','',e.name));
   li.appendChild(el('span','',new Date(e.t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})));b.appendChild(li)});
  var c=el('button','btn','Жабу');c.style.cssText='width:100%;margin-top:16px';c.onclick=closeModal;b.appendChild(c)})}
$('adm').onclick=askPin;
/* optional shared storage (works only when the host provides it) */
function initDb(){if(typeof claude==='undefined'||!claude.use)return;
 claude.use('db').then(function(d){if(!d)return;dbc=d;
  d.collection('entries').orderBy('t','desc').limit(300).onSnapshot(function(s){remote=s.docs.map(function(x){return x.data()})},function(){})
 }).catch(function(){})}
buildFeed();initDb();stepName();
})();
